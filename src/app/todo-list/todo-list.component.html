<div class="todo-app">
  <h2>Todo List</h2>
  <form (submit)="addTodo(); $event.preventDefault();">
    <input type="text" [(ngModel)]="newTodo" name="todo" placeholder="Add new todo" />
    <button type="submit">Add</button>
  </form>

  <ul>
    <li *ngFor="let todo of todos; let i = index">
      <span [class.done]="todo.done" (click)="todo.done = !todo.done">{{ todo.text }}</span>
      <button (click)="removeTodo(i)">Remove</button>
    </li>
  </ul>
</div>
